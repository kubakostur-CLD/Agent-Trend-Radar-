[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-radar"
version = "0.1.0"
description = "Codzienny monitoring trendów, memów i tematów na czasie"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "defusedxml>=0.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["trend_radar*"]

[tool.setuptools.package-data]
trend_radar = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
